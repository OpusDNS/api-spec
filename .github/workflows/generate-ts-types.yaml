name: Generate TypeScript types

on:
  repository_dispatch:
    types: [openapi_spec_update]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  generate_types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download OpenAPI Spec
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: generate-openapi-spec.yaml
          repo: OpusDNS/opusdns-api
          name: openapi-spec
          github_token: ${{secrets.GH_PAT_OPENAPI_OPUSDNS_API}}

      - name: Get current OpenAPI version
        uses: mikefarah/yq@v4
        id: currentOpenApiVersion
        with:
          cmd: yq '.info.version' src/openapi.yaml

      - name: Prepare temporary file with ignored OpenAPI version
        run: |
          cp openapi.yaml openapi-ignore-version.yaml

      - name: Set current OpenAPI version on temporary file
        run: |
          sed -i 's/^  version: .*/  version: ${{ steps.currentOpenApiVersion.outputs.result }}/' openapi-ignore-version.yaml

      - name: Override OpenAPI spec
        run: |
          mv openapi-ignore-version.yaml src/openapi.yaml

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm install

      - name: Generate TypeScript API Schema
        run: npm run generate:schema

      - name: Generate TypeScript API helpers
        run: npm run generate:helpers

      - name: Commit & Push Changes
        id: commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv openapi.yaml src/openapi.yaml
            npm run generate:schema
            npm run generate:helpers
            git add .
            git commit -m "Update OpenAPI spec and types"
            git fetch origin main
            git rebase origin/main
            npm version minor
            git push
            npm publish --access public
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The pushed SHA, not github.sha, which is the pre-run ref.
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # opusdns-mcp embeds src/openapi.yaml as a file rather than consuming the
      # npm package, so it needs a nudge to regenerate. Dispatching from here
      # rather than from opusdns-api means main is already updated when it
      # fetches, and that only real changes fire (the version-stamp dance above
      # filters out the generation timestamp).
      - name: Notify opusdns-mcp of the new spec
        if: steps.commit.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          # Scoped to opusdns-mcp only. Same token and same secret name that
          # opusdns-mcp itself uses to open the resulting PR.
          token: ${{ secrets.GH_PAT_OPENAPI_OPUSDNS_MCP }}
          repository: OpusDNS/opusdns-mcp
          event-type: openapi_spec_update
          client-payload: '{"ref": "${{ steps.commit.outputs.sha }}"}'
