name: Validate Scalar docs

# Merging to main is what publishes developers.opusdns.com, so the config and the
# generators are validated on the PR, not after. Scalar's integration also posts a
# rendered preview on each PR, but that is a human-review aid: it reports a
# successful build, not whether a nav entry points at a file that exists.
#
# On the PRs of Generate TLD Knowledge Base (here) this check does not run by
# itself: that bot opens them with GITHUB_TOKEN, and GitHub holds those runs for
# approval (action_required). So the bot runs `npm --prefix scalar run check` and
# scripts/check_scalar_nav.py itself before it opens its PR. Publish MCP docs to
# api-spec (OpusDNS/opusdns-mcp) opens its PRs with a PAT, so this check runs on
# them; that bot also runs check-config before opening the PR.

on:
  pull_request:
    paths:
      - 'scalar/**'
      - 'scripts/**'
      - '.github/workflows/scalar-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: Scalar config
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # .nvmrc is "v24.*", which node-version-file does not resolve.
          node-version: "24"
          cache: npm
          cache-dependency-path: scalar/package-lock.json

      - name: Validate scalar.config.json
        run: |
          npm ci --prefix scalar --no-audit --no-fund
          npm --prefix scalar run check

      # An icon Scalar does not know, or a filepath pointing at a file that does
      # not exist, renders as nothing and check-config does not catch either.
      - name: Every page referenced by the nav exists
        run: python3 scripts/check_scalar_nav.py

  generators:
    name: Generator tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      # These tests existed but nothing ran them.
      - name: Run the generator tests
        working-directory: scripts
        run: python -m pytest -q
