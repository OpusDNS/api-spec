name: Generate TLD Knowledge Base

# Regenerates the TLD Knowledge Base Markdown pages from the latest compiled
# specs in OpusDNS/tld-specifications and opens a PR with the diff.

on:
  workflow_dispatch:
    inputs:
      tld_specifications_ref:
        description: Branch/tag/SHA of OpusDNS/tld-specifications to use
        required: false
        default: main
  repository_dispatch:
    types: [tld_specifications_updated]
  push:
    branches: [main]
    # Regenerate when the api-spec inputs to generation change (notes files or
    # the generator itself). Spec changes are covered by repository_dispatch.
    paths:
      - 'scalar/content/tld-knowledge-base/_notes/**'
      - 'scripts/tld_knowledge_base/**'
      - 'scripts/generate_tld_knowledge_base.py'
  schedule:
    - cron: "0 5 * * 1"  # weekly safety net (Mondays 05:00 UTC)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      # The tld-specifications ref to generate from: the dispatch input, the SHA
      # sent by tld-specifications, or main for schedule and push runs.
      TLD_SPECS_REF: >-
        ${{ github.event.inputs.tld_specifications_ref
            || github.event.client_payload.ref
            || 'main' }}
    steps:
      - name: Checkout api-spec
        uses: actions/checkout@v7

      # Base on current origin/main before generating, so the bot branch never
      # looks like it reverts commits landed since checkout. Doing it here rather
      # than after generation (stash / reset --hard / stash pop) also removes the
      # failure mode where the stash pop conflicts on scalar.config.json because
      # origin/main moved meanwhile, and the job dies dirty with no PR.
      - name: Base on latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Checkout tld-specifications
        uses: actions/checkout@v7
        with:
          repository: OpusDNS/tld-specifications
          path: tld-specifications
          ssh-key: ${{ secrets.TLD_SPECS_DEPLOY_KEY }}
          # Full history, so the PR body can list the commits since the last publish.
          fetch-depth: 0
          ref: ${{ env.TLD_SPECS_REF }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: tld-specifications
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache compiled IDN tables to avoid re-downloading ~1900 from IANA each run.
      - name: Cache compiled IDN tables
        uses: actions/cache@v6
        with:
          path: tld-specifications/idn_tables
          key: idn-tables-${{ hashFiles('tld-specifications/specifications/**/*.yaml') }}
          restore-keys: |
            idn-tables-

      - name: Compile TLD specifications
        working-directory: tld-specifications
        run: |
          python scripts/compile_tld_specs.py \
            --schema ./specifications/schema.json

      - name: Regenerate TLD knowledge base
        run: |
          python scripts/generate_tld_knowledge_base.py \
            --input tld-specifications/compiled_specifications

      # git diff ignores untracked files, so a brand-new page would report
      # "unchanged" — masked here only because scalar.config.json always changes
      # alongside. --porcelain sees both.
      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- scalar/content/tld-knowledge-base scalar/scalar.config.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The bot branch is force-pushed on every spec change, so an earlier review
      # does not cover what was added since. The body lists the spec commits since
      # the last publish, recorded in .tld-specifications-sha. The file is written
      # only here, once the knowledge base changed: writing it on every run would
      # turn each dispatch into a PR. Commit subjects reach the body through a
      # file, never through an expression, so they cannot inject into the script.
      - name: Describe the source changes
        if: steps.diff.outputs.changed == 'true'
        env:
          KB: scalar/content/tld-knowledge-base
        run: |
          specs=tld-specifications
          new=$(git -C "$specs" rev-parse HEAD)
          prev=$(cat "$KB/.tld-specifications-sha" 2>/dev/null || true)
          # Same paths as notify-api-spec.yaml in tld-specifications.
          paths=(specifications common scripts/compile_tld_specs.py)
          # One name per page; new and removed pages are marked.
          pages=$(git status --porcelain -- "$KB/cctlds" "$KB/gtlds" \
            | sed -E 's#^\?\? .*/(.+)\.md$#\1 (new)#; s#^ D .*/(.+)\.md$#\1 (removed)#; s#.*/##; s/\.md$//' \
            | sort | paste -sd, - | sed 's/,/, /g')

          if [ -n "$prev" ] && git -C "$specs" cat-file -e "${prev}^{commit}" 2>/dev/null; then
            # --max-count, not `| head`: the step runs with pipefail, so a closed pipe would fail it.
            commits=$(git -C "$specs" log --reverse --max-count=50 --format='- %h %s (%an)' \
                "${prev}..${new}" -- "${paths[@]}" \
              | sed -E 's/\(#([0-9]+)\)/(OpusDNS\/tld-specifications#\1)/g')
            total=$(git -C "$specs" rev-list --count "${prev}..${new}" -- "${paths[@]}")
            if [ "$total" -gt 50 ]; then
              commits+=$'\n'"- … and $((total - 50)) older (newest 50 shown)"
            fi
            if [ -z "$commits" ]; then
              commits="- none: the change comes from this repository (generator, _notes) or from a date that passed (e.g. general availability)"
            fi
          else
            commits="- unknown: no readable .tld-specifications-sha; compare against the last merged bot PR"
          fi

          ref_note=""
          if [ "$TLD_SPECS_REF" != main ] && [ "$TLD_SPECS_REF" != "$new" ]; then
            ref_note=" (requested ref \`${TLD_SPECS_REF}\`)"
          fi

          {
            echo "Auto-generated by the **Generate TLD Knowledge Base** workflow."
            echo
            echo "Source: \`OpusDNS/tld-specifications@${new}\`${ref_note}"
            echo
            echo "**Changed pages:** ${pages:-none (only scalar.config.json changed)}"
            echo
            echo "**Spec changes since the last publish:**"
            echo "$commits"
            echo
            echo "The branch is force-pushed on every spec change: review this list, not an earlier version of this PR."
            echo
            echo "Merging this PR will publish the updated knowledge base via Scalar."
          } > "$RUNNER_TEMP/pr-body.md"
          echo "$new" > "$KB/.tld-specifications-sha"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            scalar/content/tld-knowledge-base/**
            scalar/scalar.config.json
          branch: bot/tld-knowledge-base-sync
          commit-message: "chore(tld-kb): regenerate TLD knowledge base"
          title: "chore(tld-kb): regenerate TLD knowledge base"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            automated
            tld-knowledge-base
          delete-branch: true
