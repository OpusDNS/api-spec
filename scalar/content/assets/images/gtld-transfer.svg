<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif">
<title id="t">A gTLD transfer to OpusDNS under ICANN's Transfer Policy</title>
<desc id="d">Swimlane in three lanes: your current registrar, the registry and OpusDNS. You unlock the domain and get the auth code at your current registrar. OpusDNS requests the transfer at the registry with the auth code, and the registry marks the transfer pending. Your current registrar approves or denies it within five days. The registry then transfers the domain, at once after an approval or after five days, and the domain is in your OpusDNS account.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8d99"/></marker></defs>
<rect x="2" y="32" width="796" height="76" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="67" font-size="14" font-weight="600" fill="#8a8d99">Your current</text>
<text x="16" y="85" font-size="14" font-weight="600" fill="#8a8d99">registrar</text>
<rect x="2" y="114" width="796" height="76" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="157" font-size="14" font-weight="600" fill="#8a8d99">Registry</text>
<rect x="2" y="196" width="796" height="76" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="239" font-size="14" font-weight="600" fill="#8a8d99">OpusDNS</text>
<text x="170" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">1</text>
<rect x="128.0" y="44.0" width="84" height="52" rx="8" fill="#b26b00"/>
<text x="170" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Unlock the</text>
<text x="170" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain</text>
<text x="262" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">2</text>
<rect x="220.0" y="44.0" width="84" height="52" rx="8" fill="#b26b00"/>
<text x="262" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Get the</text>
<text x="262" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">auth code</text>
<text x="354" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">3</text>
<rect x="312.0" y="208.0" width="84" height="52" rx="8" fill="#2547c9"/>
<text x="354" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Request the</text>
<text x="354" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">transfer</text>
<text x="446" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">4</text>
<rect x="404.0" y="126.0" width="84" height="52" rx="8" fill="#0e7c78"/>
<text x="446" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Transfer</text>
<text x="446" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">pending</text>
<text x="538" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">5</text>
<rect x="496.0" y="44.0" width="84" height="52" rx="8" fill="#6d3fc0"/>
<text x="538" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Approve</text>
<text x="538" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">or deny</text>
<text x="630" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">6</text>
<rect x="588.0" y="126.0" width="84" height="52" rx="8" fill="#0e7c78"/>
<text x="630" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Transfer</text>
<text x="630" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">the domain</text>
<text x="722" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">7</text>
<rect x="680.0" y="208.0" width="84" height="52" rx="8" fill="#2547c9"/>
<text x="722" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">In your</text>
<text x="722" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">account</text>
<text x="590" y="74" text-anchor="start" font-size="12" font-weight="600" fill="#8a8d99">within 5 days</text>
<line x1="212.0" y1="70" x2="218.0" y2="70" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M262,96.0 C262,150.5 354,150.5 354,205.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M354,208.0 C354,194.5 446,194.5 446,181.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M446,126.0 C446,112.5 538,112.5 538,99.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M538,96.0 C538,109.5 630,109.5 630,123.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M630,178.0 C630,191.5 722,191.5 722,205.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="16" y="289" width="15" height="15" rx="3" fill="#b26b00"/>
<text x="38" y="301" font-size="13" fill="#8a8d99">You</text>
<rect x="86.2" y="289" width="15" height="15" rx="3" fill="#6d3fc0"/>
<text x="108.2" y="301" font-size="13" fill="#8a8d99">Your current registrar</text>
<rect x="297.0" y="289" width="15" height="15" rx="3" fill="#0e7c78"/>
<text x="319.0" y="301" font-size="13" fill="#8a8d99">The registry</text>
<rect x="433.8" y="289" width="15" height="15" rx="3" fill="#2547c9"/>
<text x="455.8" y="301" font-size="13" fill="#8a8d99">OpusDNS</text>
<text x="16" y="328" font-size="13" fill="#8a8d99">Without an answer within 5 days, the registry approves the transfer on its own.</text>
</svg>
