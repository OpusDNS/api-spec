<svg xmlns="http://www.w3.org/2000/svg" width="642" height="330" viewBox="0 0 642 330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif">
<title id="t">Push to a tag: a transfer to OpusDNS</title>
<desc id="d">Swimlane in three lanes: your current registrar, the registry and OpusDNS. You unlock the domain at your current registrar. OpusDNS records the transfer. Your current registrar pushes the domain to OpusDNS's tag. The registry moves the domain. The domain is in your OpusDNS account.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8d99"/></marker></defs>
<rect x="2" y="30.0" width="638" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="67" font-size="14" font-weight="600" fill="#8a8d99">Your current</text>
<text x="16" y="85" font-size="14" font-weight="600" fill="#8a8d99">registrar</text>
<rect x="2" y="116.0" width="638" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="161" font-size="14" font-weight="600" fill="#8a8d99">Registry</text>
<rect x="2" y="202.0" width="638" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="247" font-size="14" font-weight="600" fill="#8a8d99">OpusDNS</text>
<path d="M208.0,70 H264 Q272,70 272,78 V213.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M312.0,242 H368 Q376,242 376,234 V99.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M416.0,70 H472 Q480,70 480,78 V127.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M520.0,156 H576 Q584,156 584,164 V213.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<text x="168" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">1</text>
<rect x="128.0" y="44.0" width="80" height="52" rx="8" fill="#b26b00"/>
<text x="168" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Unlock the</text>
<text x="168" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain</text>
<text x="272" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">2</text>
<rect x="232.0" y="216.0" width="80" height="52" rx="8" fill="#2547c9"/>
<text x="272" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Record the</text>
<text x="272" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">transfer</text>
<text x="376" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">3</text>
<rect x="336.0" y="44.0" width="80" height="52" rx="8" fill="#6d3fc0"/>
<text x="376" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Push the</text>
<text x="376" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain</text>
<text x="480" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">4</text>
<rect x="440.0" y="130.0" width="80" height="52" rx="8" fill="#0e7c78"/>
<text x="480" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Move the</text>
<text x="480" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain</text>
<text x="584" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">5</text>
<rect x="544.0" y="216.0" width="80" height="52" rx="8" fill="#2547c9"/>
<text x="584" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">In your</text>
<text x="584" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">account</text>
<rect x="16" y="303" width="15" height="15" rx="3" fill="#b26b00"/>
<text x="38" y="315" font-size="13" fill="#8a8d99">You</text>
<rect x="86.2" y="303" width="15" height="15" rx="3" fill="#6d3fc0"/>
<text x="108.2" y="315" font-size="13" fill="#8a8d99">Your current registrar</text>
<rect x="297.0" y="303" width="15" height="15" rx="3" fill="#0e7c78"/>
<text x="319.0" y="315" font-size="13" fill="#8a8d99">The registry</text>
<rect x="433.8" y="303" width="15" height="15" rx="3" fill="#2547c9"/>
<text x="455.8" y="315" font-size="13" fill="#8a8d99">OpusDNS</text>
</svg>
