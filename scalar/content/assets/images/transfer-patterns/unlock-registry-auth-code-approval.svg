<rect x="752.0" y="216.0" width="80" height="52" rx="8" fill="#2547c9"/>
<text x="792" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">In your</text>
<text x="792" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">account</text>
<text x="320.0" y="48.0" font-size="12" font-weight="600" fill="#8a8d99">set by the registry</text>
<text x="632.0" y="48.0" font-size="12" font-weight="600" fill="#8a8d99">within 5 days at gTLDs</text>
<rect x="16" y="303" width="15" height="15" rx="3" fill="#b26b00"/>
<text x="38" y="315" font-size="13" fill="#8a8d99">You</text>
