<path d="M520.0,156 H576 Q584,156 584,148 V99.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M624.0,70 H680 Q688,70 688,78 V127.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M728.0,156 H784 Q792,156 792,164 V213.0" fill="none" stroke="#8a8d99" stroke-width="1.8" marker-end="url(#a)"/>
<text x="168" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">1</text>
<rect x="128.0" y="44.0" width="80" height="52" rx="8" fill="#b26b00"/>
<text x="168" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Unlock the</text>
<text x="168" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">domain</text>
<text x="272" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">2</text>
<rect x="232.0" y="44.0" width="80" height="52" rx="8" fill="#b26b00"/>
<text x="272" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Get the</text>
<text x="272" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">auth code</text>
<text x="376" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#8a8d99">3</text>
<rect x="336.0" y="216.0" width="80" height="52" rx="8" fill="#2547c9"/>
<text x="376" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Request the</text>
