<svg xmlns="http://www.w3.org/2000/svg" width="850" height="330" viewBox="0 0 850 330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif">
<title id="t">Unlock, auth code set by the registry, and approval: a transfer to OpusDNS</title>
<desc id="d">Swimlane in three lanes: your current registrar, the registry and OpusDNS. You unlock the domain at your current registrar. You get the auth code, which the registry sets. OpusDNS requests the transfer at the registry. Your current registrar approves or denies it. The registry transfers the domain. The domain is in your OpusDNS account.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8d99"/></marker></defs>
<rect x="2" y="30.0" width="846" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="67" font-size="14" font-weight="600" fill="#8a8d99">Your current</text>
<text x="16" y="85" font-size="14" font-weight="600" fill="#8a8d99">registrar</text>
<rect x="2" y="116.0" width="846" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="161" font-size="14" font-weight="600" fill="#8a8d99">Registry</text>
<rect x="2" y="202.0" width="846" height="80" rx="10" fill="#8a8d99" fill-opacity="0.12"/>
<text x="16" y="247" font-size="14" font-weight="600" fill="#8a8d99">OpusDNS</text>
